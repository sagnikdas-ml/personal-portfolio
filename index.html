  <script>
    (() => {
      const tooltipMap = {
        GitHub: "GitHub · projects, code, and experiments",
        LinkedIn: "LinkedIn · work, research, and background",
        Blog: "Blog · writing on ML, LLMs, and AI systems",
        Email: "Email · reach out directly"
      };

      function applySocialTooltips() {
        Object.entries(tooltipMap).forEach(([label, tooltip]) => {
          document.querySelectorAll(`a[aria-label="${label}"]`).forEach((link) => {
            link.setAttribute("data-social-tooltip", tooltip);
          });
        });
      }

      const observer = new MutationObserver(applySocialTooltips);

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", () => {
          applySocialTooltips();
          observer.observe(document.body, { childList: true, subtree: true });
        }, { once: true });
      } else {
        applySocialTooltips();
        observer.observe(document.body, { childList: true, subtree: true });
      }
    })();
  </script>
  <script>
    // Scroll to hash on page load (specifically for navigation from other pages)
    (() => {
      const hash = window.location.hash;
      if (hash) {
        const attemptScroll = (retries = 0) => {
          const target = document.querySelector(hash);
          if (target) {
            setTimeout(() => {
              target.scrollIntoView({ behavior: 'smooth' });
            }, 100);
          } else if (retries < 40) {
            setTimeout(() => attemptScroll(retries + 1), 100);
          }
        };
        if (document.readyState === 'complete') {
          attemptScroll();
        } else {
          window.addEventListener('load', () => attemptScroll());
        }
      }
    })();
  </script>
